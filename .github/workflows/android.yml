name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all modules (core tests + both debug APKs)
        run: ./gradlew --no-daemon :core:build :uncle-app:assembleDebug :watcher-app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            uncle-app/build/outputs/apk/debug/*.apk
            watcher-app/build/outputs/apk/debug/*.apk
          retention-days: 30
